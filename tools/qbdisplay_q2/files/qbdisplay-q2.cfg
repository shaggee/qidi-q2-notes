# qbdisplay on the QIDI Q2 (prototype) - settings
# Upstream defaults: https://github.com/CharlyBrownFR/qbdisplay-plus4/blob/main/qbdisplay.example.cfg

[display]
# Q2: framebuffer + Goodix touch (used by qbdisplay.q2main)
fb: /dev/fb0
touch: /dev/input/event0
# if taps land in the wrong place: try touch_swap_xy / touch_invert_x / touch_invert_y = yes
touch_swap_xy: no
touch_invert_x: no
touch_invert_y: no
max_fps: 10
sleep_after: 600
brightness: 100
thumbnails: yes
thumb_block: 6
encoding: utf-8
# pl | en | de  (pl = Polish translation from this port)
language: pl

[moonraker]
socket: ~/printer_data/comms/moonraker.sock
http: http://127.0.0.1:7125

[printer]
name: Q2
chamber: heater_generic chamber
light_pin: caselight
fan_part: cooling_fan
fan_aux: auxiliary_cooling_fan
fan_chamber: chamber_circulation_fan
gcode_dir: ~/printer_data/gcodes
min_extrude_temp: 170

[box]
# QIDI stock box firmware (same objects as the Plus4 2.1.1). Commands not yet verified on the Q2.
backend: qidi
num_slots: 4
dry_max_temp: 65
purge_seconds: 150

[drying]
PLA: 55, 12, PLA PLA-CF PLA+
PETG: 55, 12, PETG PETG-CF PET PCTG
ABS/ASA: 60, 12, ABS ASA ABS-GF ASA-CF
TPU: 60, 12, TPU TPE

[network]
lan_only_on_cmd:
lan_only_off_cmd:

[state]
file: ~/printer_data/qbdisplay_state.json
