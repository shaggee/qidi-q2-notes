# M84 that keeps the Z motors enabled.
# Releasing stepper_z / stepper_z1 lets the two lead screws drift, the bed tilts and the next
# print start can fail at Z_TILT_ADJUST ("No trigger on probe after full movement").
# Replace the existing [gcode_macro M84] (QIDI's macro file) with this one.

[gcode_macro M84]
rename_existing: M84.1
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
    SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
